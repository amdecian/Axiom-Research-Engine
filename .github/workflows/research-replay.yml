name: Bounded research regression
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Reviewed software regression profile (not an open-ended campaign)
        required: true
        type: choice
        default: loop-replay
        options: [loop-replay, pattern-regression]
permissions:
  contents: read
concurrency:
  group: bounded-research-regression
  cancel-in-progress: false
jobs:
  replay:
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Execute fixed qualification profile
        env:
          AXIOM_PROFILE: ${{ inputs.profile }}
        run: python scripts/hosted.py --profile "$AXIOM_PROFILE"
