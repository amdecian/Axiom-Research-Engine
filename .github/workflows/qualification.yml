name: Free-tier qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    if: ${{ github.event.repository.private == false && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    name: offline (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: windows-2025, python: '3.13'}
          - {os: macos-15, python: '3.13'}
          - {os: ubuntu-24.04-arm, python: '3.13'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/hosted.py --profile quick
