<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axiom | Research control</title><style>
:root{color-scheme:dark;--bg:#0b1216;--panel:#131e24;--edge:#26383f;--text:#e9f2f0;--muted:#9eafb5;--mint:#75e0b5;--amber:#e5b970;--bad:#ff9a91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#101b20;border-bottom:1px solid var(--edge)}.logo{font-size:20px;font-weight:800;letter-spacing:.12em;color:var(--mint)}.sub{color:var(--muted);font-size:12px}button,a{color:inherit}button{font:inherit;background:#1a2a31;border:1px solid var(--edge);padding:9px 13px;border-radius:7px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--mint)}button[aria-current=true]{background:#1d3c35;color:var(--mint);border-color:#345a51}.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 65px)}nav{padding:20px 14px;border-right:1px solid var(--edge);background:#10191d}nav button{display:block;text-align:left;width:100%;background:transparent;border:1px solid transparent;margin:4px 0}nav small{display:block;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:20px 8px 8px}main{padding:25px 30px 45px;max-width:1450px;width:100%;margin:auto}h1{font-size:29px;margin:0 0 5px}h2{font-size:17px;margin:0 0 15px}h3{font-size:14px;margin:0 0 8px}p{line-height:1.6;margin:8px 0 14px}.muted{color:var(--muted)}.tag{font-size:11px;letter-spacing:.06em;font-weight:700;text-transform:uppercase;color:var(--mint);padding:5px 8px;border:1px solid #345a51;border-radius:4px;display:inline-block}.warn{color:var(--amber)}.bad{color:var(--bad)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:18px;min-width:0}.value{font-size:29px;font-weight:700;display:block;margin:8px 0;color:var(--mint)}.twocol{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin:14px 0}.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}.step{padding:10px;border:1px solid #345a51;border-radius:6px;background:#172b2a;font-size:12px}.arrow{color:var(--mint)}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:12px 9px;border-bottom:1px solid var(--edge);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}pre{background:#0b1418;border:1px solid var(--edge);border-radius:6px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:12px}code{overflow-wrap:anywhere;color:#a6e8cf}.tablewrap{overflow:auto}label{display:block;font-size:12px;color:var(--muted);margin:8px 0}select{background:var(--panel);color:var(--text);padding:8px;border:1px solid var(--edge);border-radius:6px;max-width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.notice{border-left:3px solid var(--amber);padding:8px 12px;background:#2a231b;margin:12px 0;color:#f1d7ac}.bar{background:#25383e;height:8px;border-radius:6px;overflow:hidden}.fill{height:8px;background:var(--mint)}footer{margin-top:24px;color:var(--muted);font-size:12px}.hidden{display:none}.nowrap{white-space:nowrap}@media(max-width:900px){.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--edge);padding:7px}nav small{display:none}nav button{width:auto;white-space:nowrap}main{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}}@media(max-width:500px){header{padding:12px}.logo{font-size:16px}.grid{gap:8px}.card{padding:12px}.value{font-size:23px}main{padding:12px}}
</style></head><body><header><div><span class="logo">AXIOM</span><div class="sub">MATHEMATICAL RESEARCH ENGINE / v0.3</div></div><div class="row"><span class="tag" id="mode">OFFLINE FIXTURE</span><button id="refresh">Refresh evidence</button></div></header><div class="shell"><nav aria-label="Research views"><small>Workspace</small><button data-view="overview" aria-current="true">◉ Overview</button><button data-view="campaigns">▤ Campaigns</button><button data-view="attempts">⊞ Experiments</button><button data-view="notebook">▧ Verified notebook</button><button data-view="verification">✓ Verification</button><small>Engineering</small><button data-view="roadmap">≡ Work slices</button><button data-view="settings">⚙ Controls / setup</button></nav><main id="main" tabindex="-1"></main></div><script>
const embedded=null; // replaced by export builder for standalone preview
let snapshot=embedded||{attempts:[],memory:[],events:[],ledger_valid:null,mode:'offline_fixture'};let view='overview', selected='';const main=document.getElementById('main');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>new Intl.NumberFormat().format(x);const card=(label,value,desc)=>`<div class="card"><div class="muted">${label}</div><span class="value">${esc(value)}</span><div class="sub">${desc}</div></div>`;const status=r=>`<span class="${r==='counterexample'?'bad':r==='finite_pass'?'tag':'warn'}">${esc(r.replaceAll('_',' '))}</span>`;const intro=(h,d)=>`<h1>${h}</h1><p class="muted">${d}</p>`;const table=as=>`<div class="tablewrap"><table><thead><tr><th>Strategy</th><th>Verdict</th><th>Checks</th><th>Time</th></tr></thead><tbody>${as.map(a=>`<tr><td><button data-attempt="${esc(a.attempt_id)}">${esc(a.strategy)}</button></td><td>${status(a.result.verdict)}</td><td>${a.result.passed}/${a.result.total}</td><td>${(a.elapsed_ns/1e6).toFixed(1)} ms</td></tr>`).join('')||'<tr><td colspan="4">No attempts yet. Run the CLI demo.</td></tr>'}</tbody></table></div>`;
const phases=[['S001–S008','Evidence foundation','Starter partial: ledger and fixture verifier'],['S009–S016','Isolation and orchestration','Planned'],['S017–S024','Agent and memory loop','Planned'],['S025–S032','SAT/permanent research','Planned'],['S033–S040','Formal verification','Planned'],['S041–S048','UI, controls and release','Prototype UI available; remainder planned']];
function render(){let a=snapshot.attempts||[],m=snapshot.memory||[],e=snapshot.events||[],passed=a.filter(x=>x.result.verdict==='finite_pass').length,failed=a.filter(x=>x.result.verdict==='counterexample').length;let html='';if(view==='overview'){html=intro('Research overview','Local evidence dashboard • recorded fixture results, not a P versus NP proof.')+`<div class="notice">Automation OFF. No model calls, generated-code execution, or background scheduler in this prototype.</div><div class="grid">${card('Verified attempts',a.length,'Finite test runs')}${card('Fixture passes',passed,'Not theorem proofs')}${card('Counterexamples',failed,'Rejected candidates')}${card('Approved lessons',m.length,'Explicit CLI approval')}</div><div class="card"><h2>Research loop · target architecture</h2><div class="flow">${['Retrieve evidence','Propose','Critique','Execute','Verify','Review','Archive'].map((s,i)=>`<span class="step">${s}</span>${i<6?'<span class="arrow">→</span>':''}`).join('')}</div><p class="sub">Implemented now: trusted fixture execution, independent oracles, ledger, explicit approval. Bounded foreground campaign runner is implemented. Agent generation and hardened worker isolation are planned.</p></div><div class="twocol"><div class="card"><h2>Recent experiments</h2>${table(a.slice(-5))}</div><div class="card"><h2>Research targets</h2><h3>01 · Structured permanent</h3><p class="muted">Compress coefficient families and physical interiors; preserve H1 + T2.</p><h3>02 · End-to-end SAT</h3><p class="muted">Compare against exact assignment counts on signed and asymmetric inputs.</p><h3>03 · Complexity</h3><p class="muted">Separate finite evidence from general bounds.</p></div></div><div class="card"><h2>Evidence integrity</h2><p>Hash chain: ${snapshot.ledger_valid===null?'not loaded':snapshot.ledger_valid?'PASS':'FAIL'}. ${e.length} events. Local hash-chain checks do not establish authenticity against privileged rewriting.</p></div>`;}else if(view==='campaigns'){const cs=e.filter(x=>x.kind==='campaign.started');html=intro('Campaigns','Explicitly bounded runs; every campaign records its seed and attempt limit.')+`<div class="card"><h2>Campaign ledger</h2>${cs.map(x=>`<h3>${esc(x.payload.campaign_id.slice(0,8))} · ${esc(x.ts)}</h3><p class="muted">Seeds ${esc((x.payload.seeds||[x.payload.seed]).join(', '))} · maximum ${x.payload.max_attempts} attempts · ${e.some(y=>y.kind==='campaign.completed'&&y.payload.campaign_id===x.payload.campaign_id)?'Completed':e.some(y=>y.kind==='campaign.stopped'&&y.payload.campaign_id===x.payload.campaign_id)?'Stopped':'Incomplete'}</p>`).join('')||'<p>No campaigns recorded.</p>'}<pre>python -m axiom demo --max-attempts 3</pre></div>`;}else if(view==='attempts'){let x=a.find(y=>y.attempt_id===selected)||a[0];html=intro('Experiments','Select a candidate to inspect its observed evidence.')+`<div class="card">${table(a)}</div>`+(x?`<div class="twocol"><div class="card"><h2>${esc(x.strategy)}</h2><p>${esc(x.result.description)}</p>${status(x.result.verdict)}<p>Passed ${x.result.passed} of ${x.result.total} fixtures.</p><p class="muted">Candidate units: ${fmt(x.result.candidate_units)} · oracle units: ${fmt(x.result.oracle_units)}. Different measures; no speed ratio inferred.</p><h3>Counterexample / result</h3><pre>${esc(JSON.stringify(x.result.counterexample||{verdict:x.result.verdict},null,2))}</pre></div><div class="card"><h2>Provenance</h2><p>Attempt</p><code>${esc(x.attempt_id)}</code><p>Evidence hash</p><code>${esc(x.evidence_hash)}</code><p>Source SHA-256</p><code>${esc(x.code_sha256)}</code><p>Promote a finite lesson manually:</p><pre>python -m axiom approve ${esc(x.attempt_id)}</pre></div></div>`:'');}else if(view==='notebook'){html=intro('Verified notebook','Only explicitly approved, evidence-linked lessons enter the notebook.')+`<div class="card">${m.map(x=>`<h3>${esc(x.lesson)}</h3>${status(x.grade)}<p class="muted">Evidence event: ${esc(x.evidence_event)}</p><pre>${esc(x.source_hash)}</pre>`).join('')||'<p>No approved lessons yet.</p>'}</div>`;}else if(view==='verification'){html=intro('Verification','Separate finite checks, counterexamples, mathematical derivations and formal proofs.')+`<div class="grid">${card('Finite passes',passed,'Exhaustive oracle on small fixtures')}${card('Rejected',failed,'Concrete mismatch')}${card('Formal proofs',0,'Not implemented')}${card('General bounds',0,'Not established')}</div><div class="card"><h2>Exact arithmetic checks</h2>${table(a)}<p class="muted">Fixture generator uses a reproducible seed. Hidden production holdouts and Lean integration are future work.</p></div>`;}else if(view==='roadmap'){html=intro('Engineering work slices','48 proposed slices; no implied completed production features.')+`<div class="card"><table><thead><tr><th>Slice group</th><th>Scope</th><th>Status</th></tr></thead><tbody>${phases.map(x=>`<tr>${x.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}else{html=intro('Controls and setup','Local-only starter. No start, scheduling, provider or publishing control is exposed in the browser.')+`<div class="twocol"><div class="card"><h2>Run commands</h2><pre>python -m unittest discover -s tests -v\npython -m axiom demo\npython -m axiom audit\npython -m axiom serve</pre><p>Stop the foreground server with Ctrl+C.</p></div><div class="card"><h2>Safety posture</h2><p>Provider: disabled<br>Scheduling: disabled<br>Generated code: disabled<br>Network: localhost dashboard only<br>Notebook writes: CLI review only</p><div class="notice">Production isolation, role-based access, budget leases and emergency worker termination are specified, not implemented.</div></div></div>`;}main.innerHTML=html+'<footer>AXIOM / Evidence before claims · Read-only browser · ' +(embedded?'Standalone snapshot':'Local API')+'</footer>';main.querySelectorAll('[data-attempt]').forEach(b=>b.onclick=()=>{selected=b.dataset.attempt;switchView('attempts')});}
function switchView(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.view===v)));render();main.focus({preventScroll:true})}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));async function load(){if(embedded){render();return}try{let r=await fetch('/api/v1/snapshot',{cache:'no-store'});if(!r.ok)throw Error(r.status);snapshot=await r.json();render()}catch(e){render();main.insertAdjacentHTML('afterbegin','<div class="notice">Local API unavailable. Start the CLI server or open the standalone preview.</div>')}}document.getElementById('refresh').onclick=load;load();</script></body></html>
