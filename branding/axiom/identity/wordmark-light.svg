<svg xmlns="http://www.w3.org/2000/svg" width="840" height="208" viewBox="0 0 840 208" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">AXIOM light orbital wordmark</title>
  <desc id="desc">Two crossed electron-style ellipses at plus and minus 38 degrees surround the geometric AXIOM A and its evidence node. Conceptual artwork, not a physical electron model.</desc>
<rect width="840" height="208" rx="12" fill="#F5FAF8"/>
<g transform="translate(115 102) scale(0.4)">

<g fill="none" stroke="#09694E" stroke-width="12" stroke-opacity="1"><ellipse rx="245" ry="90" transform="rotate(38)"/><ellipse rx="245" ry="90" transform="rotate(-38)"/></g>

<circle r="13" fill="#142C26"/>
<path d="M-60 70 L0 -65 L60 70 M-34 19 H34" fill="none" stroke="#09694E" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<circle cy="19" r="12" fill="#142C26"/>
<path d="M-46 92H46" fill="none" stroke="#09694E" stroke-opacity=".82" stroke-width="7" stroke-linecap="round"/>
<circle cx="200.736" cy="121.539" r="17" fill="#142C26" stroke="#09694E" stroke-width="7"/>
<circle cx="-153.834" cy="166.643" r="17" fill="#142C26" stroke="#09694E" stroke-width="7"/>
</g>
<g font-family="Arial, Helvetica, sans-serif"><text x="237" y="105" fill="#142C26" font-size="75" font-weight="700" letter-spacing="5">AXIOM</text><text x="241" y="154" fill="#09694E" font-size="25" letter-spacing="2.4">RESEARCH ENGINE</text></g>
</svg>
