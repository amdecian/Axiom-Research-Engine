<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">AXIOM dark crossed-orbit emblem</title>
  <desc id="desc">Two crossed electron-style ellipses at plus and minus 38 degrees surround the geometric AXIOM A and its evidence node. Conceptual artwork, not a physical electron model.</desc>
<rect x="1" y="1" width="142" height="142" rx="26" fill="#0B1213" stroke="#29413E" stroke-width="2"/>
<g transform="translate(72 70) scale(0.274)">

<g fill="none" stroke="#41D6A0" stroke-width="12" stroke-opacity="1"><ellipse rx="245" ry="90" transform="rotate(38)"/><ellipse rx="245" ry="90" transform="rotate(-38)"/></g>

<circle r="13" fill="#B6F7D8"/>
<path d="M-60 70 L0 -65 L60 70 M-34 19 H34" fill="none" stroke="#41D6A0" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<circle cy="19" r="12" fill="#B6F7D8"/>
<path d="M-46 92H46" fill="none" stroke="#41D6A0" stroke-opacity=".82" stroke-width="7" stroke-linecap="round"/>
<circle cx="200.736" cy="121.539" r="17" fill="#B6F7D8" stroke="#41D6A0" stroke-width="7"/>
<circle cx="-153.834" cy="166.643" r="17" fill="#B6F7D8" stroke="#41D6A0" stroke-width="7"/>
</g>
</svg>
