<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">AXIOM Research Engine — crossed-orbit identity</title>
  <desc id="desc">Two crossed electron-style ellipses at plus and minus 38 degrees surround the geometric AXIOM A and its evidence node. Conceptual artwork, not a physical electron model.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#0B1213"/><stop offset=".55" stop-color="#101C1B"/><stop offset="1" stop-color="#142221"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#41D6A0" stop-opacity=".11"/><stop offset="1" stop-color="#41D6A0" stop-opacity="0"/></radialGradient>
<radialGradient id="core"><stop stop-color="#B6F7D8" stop-opacity=".65"/><stop offset=".38" stop-color="#41D6A0" stop-opacity=".22"/><stop offset="1" stop-color="#41D6A0" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#41D6A0" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="600" fill="url(#bg)"/><rect x="930" width="670" height="600" fill="url(#grid)"/><path d="M0 0H1600" stroke="#41D6A0" stroke-width="10"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="88" y="116" fill="#41D6A0" font-size="24" letter-spacing="5" font-weight="600">MATHEMATICAL RESEARCH</text>
<text x="80" y="268" fill="#E9F4F0" font-size="144" font-weight="700" letter-spacing="8">AXIOM</text>
<text x="88" y="341" fill="#E9F4F0" font-size="58">Research Engine</text>
<text x="90" y="425" fill="#41D6A0" font-size="35">Evidence before conclusions.</text>
</g>
<g transform="translate(1220 247) scale(1.32)">
<circle r="202" fill="url(#halo)" opacity=".67"/>
<g fill="none" stroke="#41D6A0" stroke-width="4.8" stroke-opacity="0.76"><ellipse rx="245" ry="90" transform="rotate(38)"/><ellipse rx="245" ry="90" transform="rotate(-38)"/></g>
<circle r="75" fill="url(#core)" opacity=".72"/>
<circle r="12" fill="#B6F7D8"/>
<path d="M-60 70 L0 -65 L60 70 M-34 19 H34" fill="none" stroke="#41D6A0" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<circle cy="19" r="9" fill="#B6F7D8"/>
<path d="M-46 92H46" fill="none" stroke="#41D6A0" stroke-opacity=".82" stroke-width="3" stroke-linecap="round"/>
<circle cx="200.736" cy="121.539" r="11" fill="#B6F7D8" stroke="#41D6A0" stroke-width="3"/>
<circle cx="-153.834" cy="166.643" r="11" fill="#B6F7D8" stroke="#41D6A0" stroke-width="3"/>
</g>
<path d="M88 493H1512" stroke="#41D6A0" stroke-opacity=".28" stroke-width="2"/>
<text x="90" y="545" fill="#A6BDB6" font-family="Consolas, Liberation Mono, monospace" font-size="22" letter-spacing="1.0">HYPOTHESIS / EXPERIMENT / VERIFICATION / KNOWLEDGE</text>
</svg>
