<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AXIOM Research Engine / Splash preview</title>
<style>
:root{color-scheme:dark;font-family:system-ui,'Segoe UI',Arial,sans-serif;background:#080e10;color:#e9f4f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px}main{width:min(960px,100%)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;color:#a6bdb6;font-size:13px}.actions{display:flex;gap:8px}button{background:#142221;border:1px solid #345a51;color:#e9f4f0;padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer}button:hover{border-color:#41d6a0}button:focus-visible{outline:2px solid #41d6a0;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.stage{position:relative;overflow:hidden;border:1px solid #29413e;border-radius:12px;background:#0b1213;box-shadow:0 22px 90px #0008}.stage svg{display:block;width:100%;height:auto}.finish{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:20px;background:#0b1213}.finish[hidden]{display:none}.finish h1{margin:0 0 10px;font-size:clamp(20px,4vw,32px)}.finish p{max-width:42ch;margin:0;color:#a6bdb6;line-height:1.5;font-size:clamp(12px,2vw,16px)}.foot{color:#a6bdb6;font-size:12px;margin-top:12px;line-height:1.5}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</head>
<body><main>
<div class="toolbar"><span>AXIOM / STARTUP EXPERIENCE · DESIGN PREVIEW</span><div class="actions"><button id="replay">Replay 10 s</button><button id="skip">Skip animation</button></div></div>
<div class="stage" id="stage">
<svg id="art" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="splash-title splash-desc">
<title id="splash-title">AXIOM Research Engine startup animation</title><desc id="splash-desc">A geometric A and central evidence node, encircled by an emerald orbital highlight. A ten-second preview timeline, not engine progress.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e10"/><stop offset=".58" stop-color="#0b1213"/><stop offset="1" stop-color="#142221"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#41d6a0" stop-opacity=".15"/><stop offset="1" stop-color="#41d6a0" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#41d6a0" stroke-opacity=".055"/></pattern>
<linearGradient id="track"><stop stop-color="#09694e"/><stop offset="1" stop-color="#b6f7d8"/></linearGradient>
<filter id="glow" x="-100%" y="-150%" width="300%" height="400%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)"/>
<ellipse id="auraLight" cx="480" cy="188" rx="365" ry="209" fill="url(#aura)" opacity=".75"/>
<path d="M32 78V32H78M882 32H928V78M32 462V508H78M882 508H928V462" fill="none" stroke="#41d6a0" stroke-opacity=".27" stroke-width="1.5"/>
<text x="54" y="59" fill="#a6bdb6" font-family="monospace" font-size="12" letter-spacing="2">AXIOM / STARTUP</text><text x="906" y="59" fill="#a6bdb6" text-anchor="end" font-family="monospace" font-size="12" letter-spacing="2">IDENTITY 01</text>
<g fill="none" stroke="#41d6a0"><path d="M480 77 690 263H270Z M330 188 480 99 630 188 480 271Z" stroke-opacity=".11"/><ellipse cx="480" cy="184" rx="252" ry="76" stroke-opacity=".11" stroke-dasharray="2 8"/><ellipse cx="480" cy="184" rx="226" ry="62" stroke-opacity=".32" stroke-width="1.4"/></g>
<g fill="#41d6a0" opacity=".38"><circle cx="254" cy="184" r="3"/><circle cx="706" cy="184" r="3"/><circle cx="480" cy="108" r="2.5"/><circle cx="480" cy="260" r="2.5"/></g>
<g id="mark" transform="translate(408 90)"><path d="M25 116 72 24 119 116 M47 83H97" fill="none" stroke="#41d6a0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".25" filter="url(#glow)"/><path d="M25 116 72 24 119 116 M47 83H97" fill="none" stroke="#41d6a0" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><circle id="coreHalo" cx="72" cy="83" r="16" fill="none" stroke="#b6f7d8" stroke-opacity=".32"/><circle cx="72" cy="83" r="8" fill="#b6f7d8"/><path d="M36 128H108" stroke="#b6f7d8" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/></g>
<g id="motion" fill="none" stroke-linecap="round"><path id="orbit" d="M706 184 A226 62 0 1 1 254 184 A226 62 0 1 1 706 184" pathLength="100" stroke="#41d6a0" stroke-width="7" stroke-dasharray="24 76" opacity=".24" filter="url(#glow)"/><path id="tail" d="M706 184 A226 62 0 1 1 254 184 A226 62 0 1 1 706 184" pathLength="100" stroke="#41d6a0" stroke-width="2.5" stroke-dasharray="24 76" opacity=".6"/><path id="spark" d="M706 184 A226 62 0 1 1 254 184 A226 62 0 1 1 706 184" pathLength="100" stroke="#b6f7d8" stroke-width="3.5" stroke-dasharray="8 92"/><circle id="head" r="4" fill="#e9f4f0" stroke="none"/><circle id="headGlow" r="9" fill="#41d6a0" opacity=".48" filter="url(#glow)"/></g>
<g text-anchor="middle" font-family="Arial,Helvetica,sans-serif"><text x="480" y="326" fill="#e9f4f0" font-size="73" font-weight="700" letter-spacing="10">AXIOM</text><text x="480" y="366" fill="#e9f4f0" font-size="25" font-weight="500" letter-spacing="5">RESEARCH ENGINE</text><text x="480" y="404" fill="#41d6a0" font-size="20">Evidence before conclusions.</text></g>
<path d="M180 435H780" stroke="#29413e"/><text id="stageText" x="480" y="460" text-anchor="middle" fill="#a6bdb6" font-family="monospace" font-size="12" letter-spacing="1.8">IDENTITY SEQUENCE</text>
<rect x="320" y="475" width="320" height="4" rx="2" fill="#29413e"/><rect id="progress" x="320" y="475" width="0" height="4" rx="2" fill="url(#track)"/>
<text id="clock" x="480" y="500" fill="#a6bdb6" font-family="monospace" text-anchor="middle" font-size="11" letter-spacing="1.2">PREVIEW TIMELINE / 00.0 S</text>
</svg>
<div id="finish" class="finish" hidden><h1>Preview complete</h1><p>The startup handoff would occur here when the application is ready. No research engine was launched.</p></div>
</div>
<div class="foot">Offline branding preview. The timeline measures visible animation time only; it does not report research or initialization progress.</div><span id="announce" role="status" class="sr-only"></span>
</main>
<script>
'use strict';
const DURATION=10000, $=id=>document.getElementById(id), art=$('art'), finish=$('finish'), orbit=$('orbit'), tail=$('tail'), spark=$('spark'), head=$('head'), headGlow=$('headGlow'), halo=$('coreHalo'), aura=$('auraLight'), progress=$('progress'), clock=$('clock'), stageText=$('stageText'), motion=matchMedia('(prefers-reduced-motion: reduce)'), orbitLength=orbit.getTotalLength();
let raf=0, elapsed=0, last=null, running=false, generation=0;
function paint(ms){
  const t=Math.min(DURATION,Math.max(0,ms)), phase=(t/2600*100)%100, reduced=motion.matches;
  $('motion').style.visibility=reduced?'hidden':'visible';
  orbit.setAttribute('stroke-dashoffset',-phase);tail.setAttribute('stroke-dashoffset',-phase);spark.setAttribute('stroke-dashoffset',-(phase+16));
  const point=orbit.getPointAtLength(((phase+24)%100)/100*orbitLength);
  for(const dot of [head,headGlow]){dot.setAttribute('cx',point.x);dot.setAttribute('cy',point.y);}
  halo.setAttribute('r',reduced?16:16+2.5*Math.sin(t/420));aura.setAttribute('opacity',reduced?.75:.70+.12*Math.sin(t/650));
  progress.setAttribute('width',320*t/DURATION);clock.textContent='PREVIEW TIMELINE / '+(t/1000).toFixed(1).padStart(4,'0')+' S';
  stageText.textContent=t<2500?'IDENTITY SEQUENCE':t<7000?'RESEARCH ENGINE / BRAND PREVIEW':'STARTUP HANDOFF PREVIEW';
}
function complete(skipped=false){running=false;generation++;cancelAnimationFrame(raf);raf=0;last=null;finish.hidden=false;$('skip').disabled=true;$('announce').textContent=skipped?'Splash skipped. Preview complete.':'Ten-second splash preview complete.';}
function frame(now,token){if(!running||token!==generation)return;raf=0;if(document.hidden){last=null;return;}if(last!==null)elapsed+=Math.max(0,now-last);last=now;paint(elapsed);if(elapsed>=DURATION){complete();return;}raf=requestAnimationFrame(next=>frame(next,token));}
function schedule(){if(!running||document.hidden||raf)return;const token=generation;raf=requestAnimationFrame(now=>frame(now,token));}
function start(){cancelAnimationFrame(raf);raf=0;generation++;elapsed=0;last=null;running=true;finish.hidden=true;$('skip').disabled=false;$('announce').textContent='Splash preview started.';paint(0);const token=generation;raf=requestAnimationFrame(()=>{if(token!==generation||!running)return;raf=0;schedule();});}
$('replay').addEventListener('click',start);$('skip').addEventListener('click',()=>complete(true));
document.addEventListener('visibilitychange',()=>{last=null;if(document.hidden){cancelAnimationFrame(raf);raf=0;}else schedule();});
motion.addEventListener('change',()=>paint(elapsed));start();
</script>
</body></html>
