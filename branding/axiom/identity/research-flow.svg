<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="340" viewBox="0 0 1440 340" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Research evidence flow</title>
  <desc id="desc">Conceptual sequence: hypothesis, bounded experiment, independent checks, review. A counterexample is retained; a finite pass is not a proof.</desc>
<rect width="1440" height="340" rx="16" fill="#0B1213"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="56" fill="#E9F4F0" font-size="32" font-weight="700">The evidence lifecycle</text><text x="48" y="90" fill="#A6BDB6" font-size="20">A conceptual workflow; not a claim of autonomous research.</text><g transform="translate(48 122)"><rect width="294" height="126" rx="10" fill="#142221" stroke="#345A51"/><text x="20" y="32" fill="#41D6A0" font-family="Consolas, Liberation Mono, monospace" font-size="18">01</text><text x="20" y="70" fill="#E9F4F0" font-size="27" font-weight="700">Hypothesis</text><text x="20" y="103" fill="#A6BDB6" font-size="20">Define the claim</text></g><path d="M351 185h36m-10-10 10 10-10 10" fill="none" stroke="#41D6A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(398 122)"><rect width="294" height="126" rx="10" fill="#142221" stroke="#345A51"/><text x="20" y="32" fill="#41D6A0" font-family="Consolas, Liberation Mono, monospace" font-size="18">02</text><text x="20" y="70" fill="#E9F4F0" font-size="27" font-weight="700">Experiment</text><text x="20" y="103" fill="#A6BDB6" font-size="20">Bound the work</text></g><path d="M701 185h36m-10-10 10 10-10 10" fill="none" stroke="#41D6A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(748 122)"><rect width="294" height="126" rx="10" fill="#142221" stroke="#345A51"/><text x="20" y="32" fill="#41D6A0" font-family="Consolas, Liberation Mono, monospace" font-size="18">03</text><text x="20" y="70" fill="#E9F4F0" font-size="27" font-weight="700">Verification</text><text x="20" y="103" fill="#A6BDB6" font-size="20">Check independently</text></g><path d="M1051 185h36m-10-10 10 10-10 10" fill="none" stroke="#41D6A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(1098 122)"><rect width="294" height="126" rx="10" fill="#142221" stroke="#345A51"/><text x="20" y="32" fill="#41D6A0" font-family="Consolas, Liberation Mono, monospace" font-size="18">04</text><text x="20" y="70" fill="#E9F4F0" font-size="27" font-weight="700">Review</text><text x="20" y="103" fill="#A6BDB6" font-size="20">Record scope and limits</text></g><text x="48" y="298" fill="#A6BDB6" font-size="20">Retain counterexamples and null results. Finite verification does not establish a general theorem.</text></g>
</svg>
